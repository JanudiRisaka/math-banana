name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix client ci
      - name: Install backend dependencies
        run: npm --prefix server ci
      - name: Run frontend tests
        run: npm --prefix client test
      - name: Run backend smoke tests
        run: npm --prefix server test
      - name: Build frontend
        run: npm --prefix client run build
      - name: Install Chromium for browser tests
        run: npx --prefix client playwright install --with-deps chromium
      - name: Check round completion in Chromium
        run: |
          VITE_API_BASE_URL=http://localhost:5173 npm --prefix client run dev -- --port 5173 --strictPort &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:5173/game > /dev/null
          node client/e2e/round.cjs
